name: Status auto-sync

# Fallback + housekeeping run. The primary publisher is the Netlify function publish-due
# (every 5 minutes), because GitHub delays scheduled runs by hours. This run still publishes
# anything that was missed (and emails Karen if it had to), plus indexing and
# link housekeeping.

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC = 15:00 SAST (GitHub may start it hours late)
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = perform flips, dry = report only'
        type: choice
        default: live
        options: [live, dry]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run status sync (${{ inputs.mode || 'live' }})
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: node scripts/status-sync.mjs --${{ inputs.mode || 'live' }}
      - name: Content reminder (flags blogs with nothing scheduled 2 days out)
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/content-reminder.mjs
